[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "corexense-n"
version = "0.2.0"
description = "An MCP evidence gateway for Physical AI"
requires-python = ">=3.11"
dependencies = ["mcp>=1.30,<2"]
[project.optional-dependencies]
test = ["pytest>=8"]
[project.scripts]
corexense-mcp = "coresense.corexense_n.mcp_server:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "licenses/*", "vendor/tws-belief/LICENSE"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
